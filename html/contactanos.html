  <main class="contact-page-container">
    <section class="section-container">
      <h1 class="section-title">Ponte en Contacto</h1>
      <p class="section-subtitle">¿Tienes alguna propuesta laboral, proyecto o duda? Envíame un mensaje.</p>

      <div class="contact-wrapper">
        <!-- Reemplaza tu-correo@gmail.com por tu correo real de Gmail -->
        <form id="contact-form" action="https://formsubmit.co/tu-correo@gmail.com" method="POST" class="contact-form-page">
          
          <div class="form-group">
            <label for="name">Nombre Completo</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre" required>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
          </div>

          <div class="form-group">
            <label for="subject">Asunto</label>
            <input type="text" id="subject" name="subject" placeholder="Motivo de tu mensaje" required>
          </div>

          <div class="form-group">
            <label for="message">Mensaje</label>
            <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>

          <button type="submit" id="form-btn" class="btn btn-primary btn-large">
            <i class="fas fa-paper-plane"></i> Enviar Mensaje
          </button>
          
          <p id="form-status" class="form-status"></p>
        </form>
      </div>
    </section>
  </main>
